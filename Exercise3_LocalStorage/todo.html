<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Exercise 3 - To-Do List with Local Storage</title>
    <script src="todo.js" defer></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            color: #222;
        }
        h1 {
            font-size: 1.4em;
        }
        #newTask {
            padding: 6px 8px;
            font-size: 1em;
            width: 260px;
            border: 1px solid #888;
            border-radius: 3px;
        }
        #addTask {
            padding: 6px 12px;
            font-size: 1em;
            border: 1px solid #888;
            border-radius: 3px;
            background: #f0f0f0;
            cursor: pointer;
        }
        #addTask:hover {
            background: #e2e2e2;
        }
        #taskList {
            list-style: disc;
            padding-left: 30px;
            margin-top: 24px;
            max-width: 420px;
        }
        #taskList li {
            margin: 6px 0;
            line-height: 1.6em;
        }
        #taskList li button {
            margin-left: 12px;
            border: none;
            background: none;
            color: #b00020;
            cursor: pointer;
            font-size: 0.9em;
        }
        #taskList li button:hover {
            text-decoration: underline;
        }
        #status {
            color: #666;
            font-size: 0.9em;
        }
        #storageWarning {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>My To-Do List</h1>

    <input type="text" id="newTask" placeholder="Enter a task&hellip;">
    <button id="addTask">Add Task</button>

    <p id="status"></p>
    <p id="storageWarning"></p>

    <ul id="taskList"></ul>
</body>
</html>
